name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Use npm 11.8.0
        run: |
          npm install --global npm@11.8.0
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron runtime
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: >-
          npx electron -e "require('node:assert/strict').equal(process.versions.electron, require('./node_modules/electron/package.json').version); console.log(JSON.stringify({electron: process.versions.electron, node: process.versions.node}))"

      - name: Run unit tests
        run: npm test

      - name: Test generated installer with native Docker
        if: runner.os == 'Linux'
        env:
          DEPS_SMUGGLER_NATIVE_DOCKER: '1'
        run: bash scripts/verify-worktree.sh src/core/packager/docker-install-script.integration.test.ts -t 'native Docker'

      - name: Test generated APT metadata with native APT
        if: runner.os == 'Linux'
        env:
          DEPS_SMUGGLER_NATIVE_APT: '1'
        run: bash scripts/verify-worktree.sh src/core/downloaders/apt-native-consumer.integration.test.ts

      - name: Test generated Conda installer with native Conda
        if: runner.os == 'Linux'
        env:
          DEPS_SMUGGLER_NATIVE_CONDA: '1'
        run: bash scripts/verify-worktree.sh src/core/packager/conda-native-consumer.integration.test.ts

      - name: Test generated APK metadata with native apk-tools
        if: runner.os == 'Linux'
        env:
          DEPS_SMUGGLER_NATIVE_APK: '1'
        run: bash scripts/verify-worktree.sh src/core/downloaders/apk-native-consumer.integration.test.ts

      - name: Test generated Maven bundle with native Maven
        if: runner.os == 'Linux'
        env:
          DEPS_SMUGGLER_NATIVE_MAVEN: '1'
        run: bash scripts/verify-worktree.sh src/core/packager/maven-native-consumer.integration.test.ts

      - name: Test Maven project bundle with native Maven
        if: runner.os == 'Linux'
        env:
          DEPS_SMUGGLER_NATIVE_MAVEN_PROJECT: '1'
        run: bash scripts/verify-worktree.sh src/core/packager/maven-project-native-consumer.integration.test.ts

      - name: Build project
        run: npm run build

      - name: Test CLI version
        run: node dist/src/cli/index.js --version

      - name: Test CLI help
        run: node dist/src/cli/index.js --help

  runtime-contract:
    name: Runtime contract (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.13.0', '24']

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Use npm 11.8.0
        run: |
          npm install --global npm@11.8.0
          npm --version

      - name: Install dependencies with engine enforcement
        run: npm ci --engine-strict

      - name: Run CJS CLI and ESM script contract
        run: |
          bash scripts/verify-worktree.sh \
            src/cli/version.integration.test.ts \
            tests/unit/macos-release-artifacts.test.ts \
            tests/unit/macos-update-support.test.ts \
            tests/unit/macos-package-command.test.ts

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Use npm 11.8.0
        run: |
          npm install --global npm@11.8.0
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Use npm 11.8.0
        run: |
          npm install --global npm@11.8.0
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Electron TypeScript type check
        run: npx tsc --noEmit -p tsconfig.electron.json

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Use npm 11.8.0
        run: |
          npm install --global npm@11.8.0
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Use npm 11.8.0
        run: |
          npm install --global npm@11.8.0
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false
